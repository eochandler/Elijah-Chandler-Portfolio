version: "3.9"
services:
  api:
    build:
      context: .
    image: turbofan-rul:latest
    container_name: turbofan-rul-api
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.11-slim
    container_name: turbofan-mlflow
    working_dir: /workspace
    command: bash -lc "pip install mlflow==2.15.1 && mlflow ui --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000"
    volumes:
      - .:/workspace
      - ./mlruns:/mlruns
    ports:
      - "5000:5000"
